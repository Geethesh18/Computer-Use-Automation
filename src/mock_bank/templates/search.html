{% extends "base.html" %}

{% block title %}
Member Search
{% endblock %}

{% block content %}

<section class="content-card">

    <div class="card-header">
        <h2>Member Search</h2>
        <p>Enter a member ID to retrieve the member record.</p>
    </div>

    <div class="card-body">

        <form method="post" action="/members/search">

            <div class="form-group">

                <label for="member_id">
                    Member ID
                </label>

                <input
                    type="text"
                    id="member_id"
                    name="member_id"
                    required
                    autocomplete="off"
                    placeholder="Enter member ID"
                >

            </div>

            <button
                type="submit"
                class="button"
            >
                Search Member
            </button>

        </form>

    </div>

</section>

{% endblock %}
