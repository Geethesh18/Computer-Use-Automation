{% extends "base.html" %}

{% block title %}
Member Details
{% endblock %}


{% block content %}

<h2>Member Details</h2>

<table border="1" cellpadding="8">

    <tr>
        <th>Member ID</th>
        <td>{{ member.member_id }}</td>
    </tr>

    <tr>
        <th>Name</th>
        <td>{{ member.name }}</td>
    </tr>

    <tr>
        <th>Status</th>
        <td>{{ member.status }}</td>
    </tr>

</table>

<br>

<a href="/members/{{ member.member_id }}/accounts">
    View Accounts
</a>

<br><br>

<a href="/">
    Return to Member Search
</a>

{% endblock %}
